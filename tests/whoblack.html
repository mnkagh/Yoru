<!doctype html>
<html><head><meta charset="utf-8"><title>who paints black</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:1900px;height:900px}</style>
</head>
<body>
<iframe id="f" src="/?ui=0"></iframe>
<pre id="out" style="font:11px monospace;color:#0f0;background:#000;padding:8px"></pre>
<script>
const f = document.getElementById('f')
const sleep = ms => new Promise(r => setTimeout(r, ms))
addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument
  for (let i = 0; i < 60; i++){ await sleep(200); if (w.__yoru) break }
  await sleep(500)
  const b = d.getElementById('enter-tokyo'); if (b) b.click()
  await sleep(1500)
  const y = w.__yoru
  const out = []
  /* read the rendered centre pixel straight from GL */
  const probe = (label) => {
    y.renderer.render(y.scene, y.camera)
    const gl = y.renderer.getContext()
    const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight
    const buf = new Uint8Array(4)
    gl.readPixels(Math.floor(W/2), Math.floor(H/2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf)
    /* also sample a strip across the middle row */
    const strip = new Uint8Array(W * 4)
    gl.readPixels(0, Math.floor(H/2), W, 1, gl.RGBA, gl.UNSIGNED_BYTE, strip)
    let dark = 0
    for (let i = 0; i < W; i++){
      const l = 0.2126*strip[i*4] + 0.7152*strip[i*4+1] + 0.0722*strip[i*4+2]
      if (l < 14) dark++
    }
    out.push(label.padEnd(34) + ' centre=' + [buf[0],buf[1],buf[2]].join(',') +
             '  darkCols=' + dark + '/' + W)
  }
  probe('as loaded')
  const st = d.createElement('style')
  st.textContent = '#hero{display:none!important}'
  d.head.appendChild(st)
  probe('hero hidden')
  st.textContent = '#hero{display:none!important}.chapter{display:none!important}'
  probe('hero + chapters hidden')
  st.textContent = '#hero{display:none!important}.chap-media{display:none!important}'
  probe('hero + .chap-media hidden')
  st.textContent = '#hero{display:none!important}'
  const ch = d.querySelector('.chapter')
  if (ch) ch.style.setProperty('--x','1')
  probe('hero hidden, chapters back')
  /* report chapter geometry and the media figure size */
  const c0 = d.querySelector('.chapter')
  const cm = d.querySelector('.chap-media')
  const r = e => e ? [Math.round(e.getBoundingClientRect().left), Math.round(e.getBoundingClientRect().top),
                      Math.round(e.getBoundingClientRect().width), Math.round(e.getBoundingClientRect().height)].join(',') : 'none'
  out.push('chapter rect=' + r(c0))
  out.push('chap-media rect=' + r(cm))
  out.push('canvas rect=' + r(d.getElementById('scene')))
  out.push('canvas CSS w=' + w.getComputedStyle(d.getElementById('scene')).width +
           ' h=' + w.getComputedStyle(d.getElementById('scene')).height)
  document.getElementById('out').textContent = out.join('\n')
})
</script>
</body></html>
